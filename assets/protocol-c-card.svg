<text x="140" y="88" font-size="14" fill="#8b9bb4" font-weight="400" text-anchor="start" >The audit chain AetherCloud is built on. Every file operation, agent run and model output is hashed,</text>
<text x="140" y="108" font-size="14" fill="#8b9bb4" font-weight="400" text-anchor="start" >signed with a one-shot key, timestamped and appended to a tamper-evident log you can export as proof.</text>
